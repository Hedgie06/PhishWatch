name: phishwatch
description: A phishing detection app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  cupertino_icons: ^1.0.8
  
  # For API requests
  http: ^1.2.2

  # For opening external links (Telegram, etc.)
  url_launcher: ^6.2.4

  # For local storage
  shared_preferences: ^2.2.3

  # JSON annotations
  json_annotation: ^4.9.0

  # For local system notifications
  flutter_local_notifications: ^19.5.0
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  permission_handler: ^12.0.1
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Build runners
  build_runner: ^2.4.6
  
  # Icon Generator
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  # 🔴 NEW: This tells Flutter "Include these files in the app bundle"
  assets:
    - assets/icon/

# 🔴 UPDATED: Changed key from 'flutter_icons' to 'flutter_launcher_icons' (New standard)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21